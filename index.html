<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperDesk</title>
    <link rel="icon" type="image/png" href="1_osnova.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <meta name="google-site-verification" content="954p1IIAAXosqeNuPhwTYMrgN7YavM5NRjcXZ-KvgBs" />

<body>
    <header class="header">
        <img src="1_osnova.png" alt="PaperDesk">
        <h1>PaperDesk</h1>
    </header>
    <main>
        <nav class="category-tabs" aria-label="Категории обоев">
            <button class="tab-button is-active" data-device="pc" aria-pressed="true">Для ПК</button>
            <button class="tab-button" data-device="phone" aria-pressed="false">Смартфоны</button>
            <button class="tab-button" data-device="other" aria-pressed="false">Другие...</button>
        </nav>
        <nav class="sub-tabs" aria-label="Подкатегории обоев"></nav>
        <section class="wallpaper-grid" aria-label="Галерея обоев"></section>
        <p class="empty-state" hidden>В этой категории пока нет обоев.</p>
    </main>
    <div class="download-screen" role="status" aria-label="Подготовка скачивания" aria-hidden="true">
        <div class="download-progress">
            <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
            <div class="progress-track" aria-hidden="true"><span></span></div>
        </div>
    </div>
    <script src="script.js"></script>

</html>
